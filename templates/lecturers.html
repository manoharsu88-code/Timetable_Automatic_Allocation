<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Lecturer Management</title>

<style>

/* ================================
   RESET
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


/* ================================
   BODY
================================ */

body {

    min-height: 100vh;

    background: #eef5fb;

    color: #222;

    padding: 15px;
}


/* ================================
   PAGE TITLE
================================ */

.page-title {

    background: white;

    border: 1px solid #c2d4e5;

    padding: 8px 12px;

    font-size: 13px;

    font-weight: bold;

    color: #244b6b;

    margin-bottom: 15px;
}


/* ================================
   CARD
================================ */

.card {

    background: white;

    border: 1px solid #c5c5c5;

    padding: 20px;

    width: 100%;

    margin: auto;
}


/* ================================
   ADD BUTTON
================================ */

.add-area {

    display: flex;

    justify-content: flex-end;

    margin-bottom: 15px;
}


.add-button {

    width: 90px;

    height: 36px;

    border: 1px solid #397aaa;

    background: #4b9bd0;

    color: white;

    font-size: 12px;

    font-weight: bold;

    cursor: pointer;

    border-radius: 2px;
}


.add-button:hover {

    background: #357fae;
}


/* ================================
   INPUT FORM
================================ */

.form-area {

    display: none;

    background: #f4f8fb;

    border: 1px solid #c5d7e5;

    padding: 15px;

    margin-bottom: 20px;
}


.form-area.active {

    display: block;
}


.form-grid {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;
}


.input-group {

    display: flex;

    flex-direction: column;

    gap: 5px;
}


.input-group label {

    font-size: 10px;

    font-weight: bold;

    color: #444;
}


.input-group input {

    height: 35px;

    border: 1px solid #aaa;

    padding: 0 8px;

    font-size: 11px;

    outline: none;
}


.input-group input:focus {

    border-color: #4a91c7;
}


/* ================================
   FORM BUTTONS
================================ */

.form-buttons {

    display: flex;

    justify-content: flex-end;

    gap: 8px;

    margin-top: 12px;
}


.save-button {

    width: 80px;

    height: 34px;

    border: 1px solid #397aaa;

    background: #4b9bd0;

    color: white;

    font-weight: bold;

    cursor: pointer;
}


.cancel-button {

    width: 80px;

    height: 34px;

    border: 1px solid #999;

    background: #ddd;

    color: #333;

    font-weight: bold;

    cursor: pointer;
}


/* ================================
   MESSAGE
================================ */

.message {

    display: none;

    padding: 9px;

    margin-bottom: 12px;

    font-size: 11px;
}


.message.success {

    display: block;

    background: #e1f3e5;

    border: 1px solid #9ac9a3;

    color: #256333;
}


.message.error {

    display: block;

    background: #f9e1e1;

    border: 1px solid #d49a9a;

    color: #9b2222;
}


/* ================================
   TABLE
================================ */

.table-wrapper {

    width: 100%;

    overflow-x: auto;
}


.lecturer-table {

    width: 100%;

    border-collapse: collapse;

    font-size: 11px;
}


.lecturer-table th {

    background: #d7e6f2;

    border: 1px solid #aaa;

    padding: 9px;

    text-align: center;

    color: #244b6b;
}


.lecturer-table td {

    border: 1px solid #aaa;

    padding: 8px;

    text-align: center;
}


.lecturer-table tr:nth-child(even) {

    background: #f7f7f7;
}


.lecturer-table tr:hover {

    background: #eaf4fc;
}


/* ================================
   DELETE BUTTON
================================ */

.delete-button {

    border: 1px solid #b44343;

    background: #d9534f;

    color: white;

    padding: 5px 12px;

    cursor: pointer;

    font-size: 10px;

    border-radius: 2px;
}


.delete-button:hover {

    background: #b93632;
}


/* ================================
   EMPTY
================================ */

.empty {

    text-align: center;

    padding: 25px;

    color: #777;

    font-size: 12px;
}


/* ================================
   MOBILE
================================ */

@media(max-width:700px) {

    body {

        padding: 8px;
    }


    .card {

        padding: 10px;
    }


    .form-grid {

        grid-template-columns:
            1fr 1fr;
    }


    .lecturer-table {

        min-width: 650px;
    }

}


@media(max-width:450px) {

    .form-grid {

        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<!-- ================================
     PAGE TITLE
================================ -->

<div class="page-title">

    LECTURER MANAGEMENT

</div>


<div class="card">


    <!-- ================================
         MESSAGE
    ================================= -->

    <div id="message"
         class="message">
    </div>


    <!-- ================================
         ADD BUTTON
    ================================= -->

    <div class="add-area">

        <button
            class="add-button"
            onclick="showForm()">

            + ADD

        </button>

    </div>


    <!-- ================================
         FORM
    ================================= -->

    <div
        id="formArea"
        class="form-area">


        <div class="form-grid">


            <!-- NAME -->

            <div class="input-group">

                <label>
                    LECTURER NAME
                </label>

                <input
                    type="text"
                    id="lecturerName"
                    placeholder="Enter lecturer name">

            </div>


            <!-- SUBJECT -->

            <div class="input-group">

                <label>
                    SUBJECT
                </label>

                <input
                    type="text"
                    id="subject"
                    placeholder="Enter subject">

            </div>


            <!-- TOTAL PERIODS -->

            <div class="input-group">

                <label>
                    TOTAL PERIODS
                </label>

                <input
                    type="number"
                    id="totalPeriods"
                    placeholder="Enter total periods he/she takes in a week to a section"
                    min="0">

            </div>


            <!-- TOTAL SECTIONS -->

            <div class="input-group">

                <label>
                    TOTAL SECTIONS
                </label>

                <input
                    type="number"
                    id="totalSections"
                    placeholder="Enter total sections managed by he/she"
                    min="0">

            </div>


        </div>


        <!-- FORM BUTTONS -->

        <div class="form-buttons">

            <button
                class="cancel-button"
                onclick="hideForm()">

                CANCEL

            </button>


            <button
                class="save-button"
                onclick="addLecturer()">

                SAVE

            </button>

        </div>


    </div>


    <!-- ================================
         TABLE
    ================================= -->

    <div class="table-wrapper">

        <table class="lecturer-table">

            <thead>

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        LECTURER NAME
                    </th>

                    <th>
                        SUBJECT
                    </th>

                    <th>
                        TOTAL PERIODS TAKEN TO A SECTION IN A WEEK
                    </th>

                    <th>
                        TOTAL SECTIONS
                    </th>

                    <th>
                        ACTION
                    </th>

                </tr>

            </thead>


            <tbody id="lecturerList">

            </tbody>

        </table>

    </div>


</div>



<script>

/* ================================
   MESSAGE
================================ */

function showMessage(text, type) {

    const message =
        document.getElementById("message");


    message.textContent = text;


    message.className =
        "message " + type;


    setTimeout(function() {

        message.className = "message";

    }, 3000);

}


/* ================================
   SHOW FORM
================================ */

function showForm() {

    document
        .getElementById("formArea")
        .classList.add("active");


    document
        .getElementById("lecturerName")
        .focus();

}


/* ================================
   HIDE FORM
================================ */

function hideForm() {

    document
        .getElementById("formArea")
        .classList.remove("active");


    clearForm();

}


/* ================================
   CLEAR FORM
================================ */

function clearForm() {

    document.getElementById(
        "lecturerName"
    ).value = "";

    document.getElementById(
        "subject"
    ).value = "";

    document.getElementById(
        "totalPeriods"
    ).value = "";

    document.getElementById(
        "totalSections"
    ).value = "";

}


/* ================================
   ADD LECTURER
================================ */

async function addLecturer() {

    const name =
        document
            .getElementById("lecturerName")
            .value
            .trim();


    const subject =
        document
            .getElementById("subject")
            .value
            .trim();


    const totalPeriods =
        document
            .getElementById("totalPeriods")
            .value;


    const totalSections =
        document
            .getElementById("totalSections")
            .value;


    /* VALIDATION */

    if (!name) {

        showMessage(
            "Please enter lecturer name",
            "error"
        );

        return;
    }


    if (!subject) {

        showMessage(
            "Please enter subject",
            "error"
        );

        return;
    }


    if (totalPeriods === "") {

        showMessage(
            "Please enter total periods",
            "error"
        );

        return;
    }


    if (totalSections === "") {

        showMessage(
            "Please enter total sections",
            "error"
        );

        return;
    }


    try {

        const response =
            await fetch(
                "/api/lecturers",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        name: name,

                        subject: subject,

                        total_periods:
                            Number(totalPeriods),

                        total_sections:
                            Number(totalSections)

                    })

                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Unable to add lecturer"
            );

        }


        showMessage(
            "Lecturer added successfully",
            "success"
        );


        hideForm();


        loadLecturers();

    }


    catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "Server error",
            "error"
        );

    }

}


/* ================================
   LOAD LECTURERS
================================ */

async function loadLecturers() {

    try {

        const response =
            await fetch(
                "/api/lecturers"
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load lecturers"
            );

        }


        const lecturers =
            await response.json();


        const list =
            document.getElementById(
                "lecturerList"
            );


        list.innerHTML = "";


        if (lecturers.length === 0) {

            list.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="empty">

                        No lecturers created yet.

                    </td>

                </tr>

            `;

            return;
        }


        lecturers.forEach(
            function(lecturer) {


                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td>
                        ${lecturer.id}
                    </td>

                    <td>
                        ${escapeHTML(
                            lecturer.name
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            lecturer.subject
                        )}
                    </td>

                    <td>
                        ${lecturer.total_periods}
                    </td>

                    <td>
                        ${lecturer.total_sections}
                    </td>

                    <td>

                        <button
                            class="delete-button"
                            onclick="deleteLecturer(
                                ${lecturer.id}
                            )">

                            DELETE

                        </button>

                    </td>

                `;


                list.appendChild(row);

            }
        );

    }


    catch (error) {

        console.error(error);

        showMessage(
            "Unable to load lecturers",
            "error"
        );

    }

}


/* ================================
   DELETE LECTURER
================================ */

async function deleteLecturer(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this lecturer?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/lecturers/" + id,
                {
                    method: "DELETE"
                }
            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Unable to delete lecturer"
            );

        }


        showMessage(
            "Lecturer deleted successfully",
            "success"
        );


        loadLecturers();

    }


    catch (error) {

        console.error(error);

        showMessage(
            error.message ||
            "Server error",
            "error"
        );

    }

}


/* ================================
   HTML ESCAPE
================================ */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* ================================
   LOAD ON START
================================ */

window.addEventListener(
    "load",
    function() {

        loadLecturers();

    }
);

</script>

</body>

</html>
