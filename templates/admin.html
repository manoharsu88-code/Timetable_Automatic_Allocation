<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #eef5fb;
    padding: 15px;
    color: #222;
}

.container {
    width: 100%;
    max-width: 1000px;
    margin: auto;
}

.title {
    background: white;
    border: 1px solid #c2d4e5;
    padding: 12px;
    margin-bottom: 15px;
    color: #244b6b;
    font-size: 16px;
    font-weight: bold;
}

.card {
    background: white;
    border: 1px solid #c5c5c5;
    padding: 20px;
}

.welcome {
    background: #dceefa;
    border: 1px solid #a9c8dc;
    padding: 10px;
    margin-bottom: 15px;
    color: #244b6b;
    font-size: 12px;
}

.table-wrapper {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 700px;
    border-collapse: collapse;
    font-size: 11px;
}

th {
    background: #d7e6f2;
    border: 1px solid #aaa;
    padding: 10px;
    color: #244b6b;
}

td {
    border: 1px solid #aaa;
    padding: 8px;
    text-align: center;
}

input,
select {
    width: 100%;
    height: 32px;
    border: 1px solid #aaa;
    padding: 5px;
    font-size: 11px;
    outline: none;
}

input:focus,
select:focus {
    border-color: #4b9bd0;
}

button {
    border: none;
    cursor: pointer;
    color: white;
    padding: 7px 12px;
    font-size: 10px;
    margin: 2px;
}

.update {
    background: #4b9bd0;
}

.update:hover {
    background: #357fae;
}

.delete {
    background: #d9534f;
}

.delete:hover {
    background: #b93632;
}

.logout {
    display: inline-block;
    background: #555;
    color: white;
    text-decoration: none;
    padding: 8px 15px;
    font-size: 11px;
    margin-top: 15px;
}

.logout:hover {
    background: #333;
}

.message {
    display: none;
    padding: 9px;
    margin-bottom: 12px;
    font-size: 11px;
}

.message.success {
    display: block;
    background: #e1f3e5;
    border: 1px solid #9ac9a3;
    color: #256333;
}

.message.error {
    display: block;
    background: #f9e1e1;
    border: 1px solid #d49a9a;
    color: #9b2222;
}

.loading,
.empty {
    padding: 20px;
    text-align: center;
    color: #777;
}

</style>

</head>

<body>


<div class="container">


    <div class="title">

        ADMIN DASHBOARD

    </div>


    <div class="card">


        <div class="welcome">

            Welcome, <b>{{ username }}</b>

        </div>


        <div id="message"
             class="message">
        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>USERNAME</th>

                        <th>PASSWORD</th>

                        <th>ROLE</th>

                        <th>ACTION</th>

                    </tr>

                </thead>


                <tbody id="userList">

                    <tr>

                        <td colspan="5"
                            class="loading">

                            Loading...

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


        <a href="/logout"
           class="logout">

            LOGOUT

        </a>


    </div>

</div>


<script>

/* =========================================
   MESSAGE
========================================= */

function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;


    setTimeout(function() {

        message.className =
            "message";

    }, 4000);

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


/* =========================================
   LOAD USERS
========================================= */

async function loadUsers() {

    const list =
        document.getElementById("userList");


    try {

        const response =
            await fetch(
                "/api/admin/users"
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Unable to load users."
            );

        }


        list.innerHTML = "";


        if (!data.length) {

            list.innerHTML = `

                <tr>

                    <td colspan="5"
                        class="empty">

                        No users found.

                    </td>

                </tr>

            `;

            return;

        }


        data.forEach(function(user) {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${user.id}
                </td>


                <td>

                    <input
                        type="text"
                        id="username-${user.id}"
                        value="${escapeHTML(
                            user.username
                        )}">

                </td>


                <td>

                    <input
                        type="text"
                        id="password-${user.id}"
                        placeholder="Enter new password">

                </td>


                <td>

                    <select
                        id="role-${user.id}">

                        <option value="admin"
                            ${user.role === "admin"
                            ? "selected" : ""}>

                            Admin

                        </option>

                        <option value="lecturer"
                            ${user.role === "lecturer"
                            ? "selected" : ""}>

                            Lecturer

                        </option>

                        <option value="student"
                            ${user.role === "student"
                            ? "selected" : ""}>

                            Student

                        </option>

                    </select>

                </td>


                <td>

                    <button
                        class="update"
                        onclick="
                            updateUser(${user.id})
                        ">

                        UPDATE

                    </button>


                    <button
                        class="delete"
                        onclick="
                            deleteUser(${user.id})
                        ">

                        DELETE

                    </button>

                </td>

            `;


            list.appendChild(row);

        });

    }


    catch(error) {

        console.error(error);


        list.innerHTML = `

            <tr>

                <td colspan="5"
                    class="empty">

                    ${escapeHTML(
                        error.message
                    )}

                </td>

            </tr>

        `;

    }

}


/* =========================================
   UPDATE USER
========================================= */

async function updateUser(id) {

    const username =
        document
            .getElementById(
                "username-" + id
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "password-" + id
            )
            .value;


    const role =
        document
            .getElementById(
                "role-" + id
            )
            .value;


    if (!username) {

        showMessage(
            "Username cannot be empty.",
            "error"
        );

        return;

    }


    if (!confirm(
        "Update this user?"
    )) {

        return;

    }


    try {

        const response =
            await fetch(

                "/api/admin/users/" + id,

                {

                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            username:
                                username,

                            password:
                                password,

                            role:
                                role

                        })

                }

            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Unable to update user."
            );

        }


        showMessage(
            "User updated successfully.",
            "success"
        );


        loadUsers();

    }


    catch(error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

    }

}


/* =========================================
   DELETE USER
========================================= */

async function deleteUser(id) {

    if (!confirm(
        "Are you sure you want to delete this user?"
    )) {

        return;

    }


    try {

        const response =
            await fetch(

                "/api/admin/users/" + id,

                {

                    method: "DELETE"

                }

            );


        const result =
            await response.json();


        if (!response.ok) {

            throw new Error(
                result.message ||
                "Unable to delete user."
            );

        }


        showMessage(
            "User deleted successfully.",
            "success"
        );


        loadUsers();

    }


    catch(error) {

        console.error(error);

        showMessage(
            error.message,
            "error"
        );

    }

}


/* =========================================
   LOAD
========================================= */

window.addEventListener(
    "load",
    loadUsers
);

</script>


</body>

</html>
