<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Lecturer Workload Management</title>


<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}


/* =========================
   BODY
========================= */

body {

    min-height: 100vh;

    background: #dce8f5;

    color: #222;
}


/* =========================
   BLUE BAR
========================= */

.topbar {

    height: 50px;

    background: #8fc4ed;

    border-top: 1px solid #6daedc;

    border-bottom: 1px solid #6daedc;

    display: flex;

    align-items: center;

    padding: 0 12px;

    font-size: 11px;

    color: #333;
}


/* =========================
   MAIN
========================= */

.main {

    display: flex;

    height: calc(100vh - 27px);
}


/* =========================
   SIDEBAR
========================= */

.sidebar {

    width: 170px;

    flex-shrink: 0;

    background: #e8f2fb;

    border-right: 2px solid #b6cde2;
}


/* =========================
   MENU TITLE
========================= */

.menu-title {

    background: #d7e9f8;

    color: #333;

    font-size: 12px;

    font-weight: bold;

    padding: 8px 10px;

    border-bottom: 1px solid #b7cde2;
}


/* =========================
   MENU BUTTON
========================= */

.menu-button {

    width: 100%;

    border: none;

    border-bottom: 1px solid #b8d1e6;

    background: #eef6fd;

    padding: 10px 8px;

    text-align: left;

    font-size: 10px;

    color: #333;

    cursor: pointer;
}


.menu-button:hover {

    background: #cfe6f8;
}


.menu-button.active {

    background: #9bc9ec;

    color: #123d62;

    font-weight: bold;
}


/* =========================
   RIGHT SIDE
========================= */

.content {

    flex: 1;

    min-width: 0;

    background: #eef5fb;
}


/* =========================
   IFRAME
========================= */

#pageFrame {

    width: 100%;

    height: 100%;

    border: none;

    display: block;

    background: #eef5fb;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

    .sidebar {

        width: 120px;
    }


    .menu-button {

        font-size: 9px;

        padding: 9px 5px;
    }


    .menu-title {

        font-size: 10px;
    }

}

</style>

</head>


<body>


<!-- =========================
     BLUE BAR
========================= -->

<div class="topbar">

    <h1> Welcome to Lecturer Workload Management and Timetable Creation System </h1>

</div>


<!-- =========================
     MAIN
========================= -->

<div class="main">


    <!-- =====================
         LEFT MENU
    ====================== -->

    <aside class="sidebar">


        <div class="menu-title">

            <h3>MENU</h3>

        </div>


        <!-- CLASSROOMS -->

        <button
            class="menu-button active"
            onclick="openPage('/classrooms', this)">

            <h3>Add Sections</h3>

        </button>


 


        <!-- FUTURE BUTTONS -->

        <button 
            class="menu-button"
            onclick="openPage('/lecturers',this)">

            <h3>Add Lecturers Details</h3>

        </button>

        
        <button class="menu-button"
            onclick="openPage('/subjects_lab',this)">

            <h3>Lab Allotment</h3>

        </button>

        <button class="menu-button"
            onclick="openPage('/subjects',this)">

            <h3>Subject Allotment</h3> 

        </button>
        

        <button class="menu-button"
            onclick="openPage('/lect',this)">

            <h3>Lecturers Wokload Inspection</h3>

        </button>
        
        <button class="menu-button"
            onclick="openPage('/weekly-test',this)">

            <h3>Weekly Test Schedule Management</h3>

        </button>
        
        <button class="menu-button"
            onclick="openPage('/lecturer-section-allocation',this)">

            <h3>Weekly Test Invigilation Allotment</h3>

        </button>

               <!-- TIMETABLE -->

        <button
            class="menu-button"
            onclick="openPage('/timetable', this)">

            <h3>Final Timetable</h3>

        </button>

    </aside>


    <!-- =====================
         RIGHT CONTENT
    ====================== -->

    <main class="content">

        <iframe
            id="pageFrame"
            src="/classrooms">
        </iframe>

    </main>


</div>



<script>

/* =========================
   OPEN HTML PAGE
========================= */

function openPage(url, button) {


    /* Change iframe */

    document
        .getElementById("pageFrame")
        .src = url;


    /* Remove active */

    document
        .querySelectorAll(".menu-button")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    /* Add active */

    button.classList.add("active");

}

</script>
 

</body>

</html>
